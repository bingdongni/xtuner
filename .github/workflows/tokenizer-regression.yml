name: Tokenizer worker regression

on:
  push:
    branches: ['ci/tokenizer-baseline-v2', 'ci/tokenizer-fix']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  subprocess-regressions:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Exercise production worker functions in isolated processes
        run: |
          if [ "${GITHUB_REF_NAME}" = 'ci/tokenizer-baseline-v2' ]; then
            python ci-validation/parallel-smoke.py baseline
          else
            python ci-validation/parallel-smoke.py fixed
          fi
