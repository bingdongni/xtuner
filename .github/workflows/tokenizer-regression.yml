name: Tokenizer worker regression

on:
  push:
    branches: ['ci/tokenizer-baseline-v2', 'ci/tokenizer-fix-v3']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  subprocess-regressions:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Exercise production worker functions in isolated processes
        run: |
          if [ "${GITHUB_REF_NAME}" = 'ci/tokenizer-baseline-v2' ]; then
            python ci-validation/parallel-smoke.py baseline
          else
            python ci-validation/parallel-smoke.py fixed
          fi
  cpu-pytest:
    if: github.ref_name == 'ci/tokenizer-fix-v3'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install CPU-only test dependencies
        run: |
          python -m pip install 'torch==2.9.1' --index-url https://download.pytorch.org/whl/cpu
          python -m pip install pytest numpy 'mmengine==0.11.0rc2' pydantic tqdm
      - name: Run JSONL subprocess regressions with isolated imports
        env:
          PYTEST_DISABLE_PLUGIN_AUTOLOAD: '1'
        run: python ci-validation/run-isolated-pytest.py
